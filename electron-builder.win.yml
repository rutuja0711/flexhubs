# Windows NSIS installer (built after Electron Forge packages the app).
# See scripts/ci/build-windows-installer.mjs and INSTALL.md.
appId: com.flexodyn.flexhubs
productName: FlexHubs Desktop
copyright: Copyright © Flexodyn Solutions. All rights reserved.

directories:
  output: out/make/nsis
  buildResources: build

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/logo-symbol.ico
  legalTrademarks: FlexHubs
  executableName: FlexHubs Desktop
  signAndEditExecutable: false
  signExecutable: true
  signtoolOptions:
    publisherName: Flexodyn Solutions

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  allowElevation: true
  installerIcon: assets/logo-symbol.ico
  uninstallerIcon: assets/logo-symbol.ico
  installerHeaderIcon: assets/logo-symbol.ico
  license: assets/desktop-eula.txt
  # Shortcuts are created on the Finish page when the user checks the boxes
  # (see scripts/windows/installer.nsh). Defaults are checked.
  createDesktopShortcut: false
  createStartMenuShortcut: false
  shortcutName: FlexHubs Desktop
  runAfterFinish: true
  menuCategory: FlexHubs
  artifactName: FlexHubs-Setup.${ext}
  uninstallDisplayName: FlexHubs Desktop
  deleteAppDataOnUninstall: false
  installerLanguages:
    - en_US
  language: '1033'
  displayLanguageSelector: false
  packElevateHelper: true
  include: scripts/windows/installer.nsh
  guid: 8f4c2a1b-6d3e-4f5a-9c8b-1e2d3f4a5b6c
