name: Build Desktop App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Mac universal app
        if: matrix.os == 'macos-latest'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run make:mac

      - name: Build Windows x64 installer
        if: matrix.os == 'windows-latest'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run make:win

      - name: Upload Mac zip
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: FlexHubs-Desktop-mac-universal
          path: out/make/zip/darwin/**/*.zip
          if-no-files-found: error

      - name: Stage Windows Setup.exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $setupDir = "out/make/squirrel.windows/x64"
          if (-not (Test-Path $setupDir)) {
            throw "Squirrel output not found at $setupDir"
          }

          $setup = Get-ChildItem -Path $setupDir -Filter *.exe |
            Where-Object { $_.Name -notmatch '\.exe\.exe$' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $setup) {
            throw "Setup.exe not found under $setupDir"
          }

          Copy-Item -Path $setup.FullName -Destination out/FlexHubs-Desktop-Setup.exe -Force
          Write-Host "Staged installer: $($setup.Name) -> out/FlexHubs-Desktop-Setup.exe"

      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: FlexHubs-Desktop-windows-x64
          path: |
            out/FlexHubs-Desktop-Setup.exe
            out/make/squirrel.windows/x64/FlexHubs-Desktop-Setup.exe
            out/make/zip/win32/x64/*.zip
          if-no-files-found: error
