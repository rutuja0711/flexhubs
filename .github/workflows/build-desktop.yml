name: Build Desktop App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import Mac signing certificate
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/ci/import-macos-signing-cert.sh

      - name: Prepare Windows signing certificate
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/ci/prepare-windows-signing.ps1

      - name: Verify desktop build secrets (Mac)
        if: matrix.os == 'macos-latest'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/ci/verify-desktop-build-env.mjs

      - name: Verify desktop build secrets (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/ci/verify-desktop-build-env.mjs

      - name: Build Mac universal app
        if: matrix.os == 'macos-latest'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MAC_DEVELOPER_IDENTITY: ${{ secrets.MAC_DEVELOPER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run make:mac

      - name: Build Windows x64 installer
        if: matrix.os == 'windows-latest'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run make:win

      - name: Verify Mac code signing
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -z "${MACOS_CERTIFICATE}" ]; then
            echo "No MACOS_CERTIFICATE secret configured — skipping signing verification."
            exit 0
          fi
          bash scripts/ci/verify-macos-signing.sh

      - name: Verify Windows code signing
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "No WINDOWS_CERTIFICATE secret configured — skipping signing verification."
            exit 0
          }
          ./scripts/ci/verify-windows-signing.ps1

      - name: Stage Mac DMG and auto-update zip
        if: matrix.os == 'macos-latest'
        run: |
          dmg="$(find out/make -name 'FlexHubs-Desktop.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo "FlexHubs-Desktop.dmg not found under out/make"
            find out/make -name '*.dmg' || true
            exit 1
          fi
          cp "$dmg" out/FlexHubs-Desktop.dmg
          echo "Staged installer: $dmg -> out/FlexHubs-Desktop.dmg"

          mac_zip="$(find out/make -path '*/zip/darwin/*/*.zip' -print -quit)"
          if [ -z "$mac_zip" ]; then
            echo "Mac update zip not found (MakerZIP for darwin). Expected under out/make/zip/darwin/"
            find out/make -name '*.zip' || true
            exit 1
          fi
          cp "$mac_zip" out/FlexHubs-Desktop-mac.zip
          echo "Staged auto-update zip: $mac_zip -> out/FlexHubs-Desktop-mac.zip"

          node scripts/ci/generate-updater-metadata.mjs \
            --platform mac \
            --artifact out/FlexHubs-Desktop-mac.zip \
            --publish-name FlexHubs-Desktop-mac.zip \
            --out-dir out

      - name: Stage Windows Setup.exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./scripts/ci/stage-windows-installer.ps1
          node scripts/ci/generate-updater-metadata.mjs `
            --platform win `
            --artifact out/FlexHubs-Desktop-Setup.exe `
            --publish-name FlexHubs-Desktop-Setup.exe `
            --out-dir out

      - name: Publish Mac DMG to GitHub Release
        if: matrix.os == 'macos-latest' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          tag="desktop-latest"
          repo="${{ github.repository }}"
          if [ -n "$MACOS_CERTIFICATE" ]; then
            notes="$(cat <<EOF
          Signed and notarized build from commit ${{ github.sha }}.

          **Mac:** \`FlexHubs-Desktop.dmg\`
          **Windows:** \`FlexHubs-Desktop-Setup.exe\`
          EOF
          )"
          else
            notes="$(cat <<EOF
          **Unsigned build** — Gatekeeper/SmartScreen warnings will appear.

          Add signing secrets from SIGNING.md, then rebuild.

          Commit: ${{ github.sha }}
          EOF
          )"
          fi

          gh release view "$tag" --repo "$repo" 2>/dev/null || \
            gh release create "$tag" --repo "$repo" --title "FlexHubs Desktop (latest build)" --notes "$notes" --prerelease
          gh release edit "$tag" --repo "$repo" --notes "$notes"
          gh release upload "$tag" \
            out/FlexHubs-Desktop.dmg \
            out/FlexHubs-Desktop-mac.zip \
            out/latest-mac.yml \
            --repo "$repo" --clobber

      - name: Verify Mac update feed and zip checksum
        if: matrix.os == 'macos-latest' && github.ref == 'refs/heads/main'
        run: node scripts/ci/verify-update-feed.mjs --verify-sha512

      - name: Publish Windows installer to GitHub Release
        if: matrix.os == 'windows-latest' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          $tag = "desktop-latest"
          $repo = "${{ github.repository }}"
          if ($env:WINDOWS_CERTIFICATE) {
            $notes = @"
          Signed build from commit ${{ github.sha }}.

          **Mac:** ``FlexHubs-Desktop.dmg``
          **Windows:** ``FlexHubs-Desktop-Setup.exe``
          "@
          } else {
            $notes = @"
          **Unsigned build** — Gatekeeper/SmartScreen warnings will appear.

          Add signing secrets from SIGNING.md, then rebuild.

          Commit: ${{ github.sha }}
          "@
          }

          gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title "FlexHubs Desktop (latest build)" --notes $notes --prerelease
          } else {
            gh release edit $tag --repo $repo --notes $notes
          }

          gh release upload $tag `
            out/FlexHubs-Desktop-Setup.exe `
            out/latest.yml `
            --repo $repo --clobber
