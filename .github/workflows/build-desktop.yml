name: Build Desktop App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure WiX Toolset (Windows MSI)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\WiX Toolset v3.14\bin',
            'C:\Program Files\WiX Toolset v3.14\bin'
          )

          $wixBin = $candidates | Where-Object { Test-Path (Join-Path $_ 'candle.exe') } | Select-Object -First 1

          if (-not $wixBin) {
            choco install wixtoolset -y
            $wixBin = $candidates | Where-Object { Test-Path (Join-Path $_ 'candle.exe') } | Select-Object -First 1
          }

          if (-not $wixBin) {
            throw 'WiX Toolset not found. candle.exe is required to build the MSI.'
          }

          Write-Host "Using WiX at $wixBin"
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin

      - name: Build Mac universal app
        if: matrix.os == 'macos-latest'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run make:mac

      - name: Build Windows x64 installer
        if: matrix.os == 'windows-latest'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run make:win

      - name: Upload Mac zip
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: FlexHubs-Desktop-mac-universal
          path: out/make/zip/darwin/**/*.zip
          if-no-files-found: error

      - name: Rename Windows MSI for download
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path out/make/wix/x64 -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI output not found under out/make/wix/x64" }
          Copy-Item -Path $msi.FullName -Destination out/FlexHubs-Desktop-Setup.msi -Force

      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: FlexHubs-Desktop-windows-x64
          path: |
            out/FlexHubs-Desktop-Setup.msi
            out/make/wix/x64/*.msi
          if-no-files-found: error
